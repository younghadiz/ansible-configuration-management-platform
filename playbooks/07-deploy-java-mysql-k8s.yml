---
- name: Deploy Java and MySQL application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    namespace: java-mysql
    manifests_dir: "../kubernetes/exercise-07"

  tasks:
    - name: Validate Docker credentials
      ansible.builtin.assert:
        that:
          - docker_user is defined
          - docker_pass is defined
          - mysql_root_password is defined
          - mysql_app_password is defined

    - name: Create namespace
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/namespace.yml"

    - name: Create database secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: database-secret
            namespace: "{{ namespace }}"
          type: Opaque
          stringData:
            MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
            DB_PWD: "{{ mysql_app_password }}"
      no_log: true

    - name: Create Docker registry pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: docker-registry-secret
            namespace: "{{ namespace }}"
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: >-
              {{
                {
                  "auths": {
                    "https://index.docker.io/v1/": {
                      "username": docker_user,
                      "password": docker_pass,
                      "auth": (docker_user ~ ":" ~ docker_pass) | b64encode
                    }
                  }
                } | to_json
              }}
      no_log: true

    - name: Deploy application ConfigMap
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/configmap.yml"

    - name: Deploy MySQL
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/mysql-deployment.yml"

    - name: Deploy MySQL service
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/mysql-service.yml"

    - name: Deploy Java application
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/java-deployment.yml"

    - name: Deploy Java service
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/java-service.yml"

    - name: Install ingress-nginx course dependency
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx
        chart_repo_url: https://kubernetes.github.io/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: true
        state: present

    - name: Deploy Java ingress
      kubernetes.core.k8s:
        state: present
        src: "{{ manifests_dir }}/java-ingress.yml"