---
- name: Provision AWS network and Ansible control server
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../generated/exercise-06.yml

  tasks:
    - name: Create project VPC
      amazon.aws.ec2_vpc_net:
        name: ansible-capstone-vpc
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        dns_support: true
        dns_hostnames: true
        state: present
        tags:
          Project: ansible-capstone
      register: capstone_vpc

    - name: Create public subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        az: "{{ availability_zone }}"
        map_public: true
        state: present
        tags:
          Name: ansible-capstone-public
          Project: ansible-capstone
          Tier: public
      register: public_subnet

    - name: Create private database subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        cidr: "{{ private_subnet_cidr }}"
        az: "{{ availability_zone }}"
        map_public: false
        state: present
        tags:
          Name: ansible-capstone-private-db
          Project: ansible-capstone
          Tier: private
      register: private_subnet

    - name: Create Internet Gateway
      community.aws.ec2_vpc_igw:
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        state: present
        tags:
          Name: ansible-capstone-igw
      register: internet_gateway

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ internet_gateway.gateway_id }}"
        tags:
          Name: ansible-capstone-public-rt

    - name: Allocate Elastic IP for NAT Gateway
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        in_vpc: true
        state: present
        tags:
          Name: ansible-capstone-nat-eip
      register: nat_eip

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        region: "{{ aws_region }}"
        subnet_id: "{{ public_subnet.subnet.id }}"
        allocation_id: "{{ nat_eip.allocation_id }}"
        wait: true
        state: present
        tags:
          Name: ansible-capstone-nat
      register: nat_gateway

    - name: Create private route table through NAT
      amazon.aws.ec2_vpc_route_table:
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        subnets:
          - "{{ private_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            nat_gateway_id: "{{ nat_gateway.nat_gateway_id }}"
        tags:
          Name: ansible-capstone-private-rt

    - name: Create control security group
      amazon.aws.ec2_security_group:
        name: ansible-control-sg
        description: SSH access to Ansible control node
        region: "{{ aws_region }}"
        vpc_id: "{{ capstone_vpc.vpc.id }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ admin_cidr }}"
      register: control_sg

    - name: Create Ansible control server
      amazon.aws.ec2_instance:
        name: ansible-control-plane
        region: "{{ aws_region }}"
        key_name: "{{ control_key_name }}"
        image_id: "{{ ubuntu_ami_id }}"
        instance_type: "{{ control_instance_type }}"
        vpc_subnet_id: "{{ public_subnet.subnet.id }}"
        security_group: "{{ control_sg.group_id }}"
        network:
          assign_public_ip: true
        tags:
          Project: ansible-capstone
          Role: ansible-control
          ManagedBy: ansible
        exact_count: 1
        wait: true

    - name: Save generated network IDs
      ansible.builtin.copy:
        dest: ../generated/exercise-06-network.yml
        mode: "0600"
        content: |
          vpc_id: "{{ capstone_vpc.vpc.id }}"
          public_subnet_id: "{{ public_subnet.subnet.id }}"
          private_subnet_id: "{{ private_subnet.subnet.id }}"
      delegate_to: localhost